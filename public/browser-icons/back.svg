<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" shape-rendering="crispEdges">
  <!-- Arrowhead: solid left-pointing triangle (cols 2–7, rows 4–12) -->
  <rect x="2" y="8" width="1" height="1" fill="#000"/>
  <rect x="3" y="7" width="1" height="3" fill="#000"/>
  <rect x="4" y="6" width="1" height="5" fill="#000"/>
  <rect x="5" y="5" width="1" height="7" fill="#000"/>
  <rect x="6" y="4" width="1" height="9" fill="#000"/>
  <!-- Stem: horizontal rectangle (cols 7–13, rows 7–9) -->
  <rect x="7" y="6" width="7" height="5" fill="#000"/>
  <!-- Notch the stem corners so arrowhead reads cleanly -->
</svg>
