<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Raj's Clone Stack</title>
<!--
  Generated by scripts/build-interview.ts from interview/src/. Do not edit this file by hand:
  edit interview/src/* or content/questions/* and run `bun scripts/build-interview.ts`.
  Question bank {{BANK_VERSION}} · {{QUESTION_COUNT}} questions. Works offline from file://.
  Your answers live in this browser's storage until you export them. They are never in this file.
-->
<style>
{{STYLE}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to the stack</a>

<nav class="menubar" aria-label="Menu bar">
  <div class="menus">
    <div class="menu">
      <button type="button" class="menu-title logo" data-menu="m-about" aria-expanded="false" aria-controls="m-about" aria-label="About">{{LOGO}}</button>
      <div class="menu-list" id="m-about" hidden>
        <button type="button" data-action="about">About this stack…</button>
        <button type="button" data-action="how-export">How do answers reach the clone?</button>
      </div>
    </div>
    <div class="menu">
      <button type="button" class="menu-title" data-menu="m-file" aria-expanded="false" aria-controls="m-file">File</button>
      <div class="menu-list" id="m-file" hidden>
        <button type="button" data-action="export">Export answers…</button>
        <button type="button" data-action="import-pack">Import question pack…</button>
        <hr>
        <button type="button" data-action="backup">Backup all data</button>
        <button type="button" data-action="restore">Restore backup…</button>
      </div>
    </div>
    <div class="menu">
      <button type="button" class="menu-title" data-menu="m-go" aria-expanded="false" aria-controls="m-go">Go</button>
      <div class="menu-list" id="m-go" hidden>
        <button type="button" data-action="home">Home</button>
        <hr>
        <button type="button" data-action="mode-shuffle">Shuffle</button>
        <button type="button" data-action="mode-deep">Deep dive</button>
        <button type="button" data-action="mode-lightning">Lightning round</button>
        <button type="button" data-action="mode-revisit">Revisit answers</button>
        <button type="button" data-action="mode-new">New cards</button>
        <button type="button" data-action="mode-snoozed">Snoozed cards</button>
      </div>
    </div>
    <div class="menu">
      <button type="button" class="menu-title" data-menu="m-card" aria-expanded="false" aria-controls="m-card">Card</button>
      <div class="menu-list" id="m-card" hidden>
        <button type="button" data-action="add-card">Add your own card…</button>
        <hr>
        <button type="button" data-action="star" data-needs-card>Star this card</button>
        <button type="button" data-action="dig" data-needs-card>Dig deeper</button>
        <button type="button" data-action="snooze" data-needs-card>Snooze this card</button>
      </div>
    </div>
  </div>
  <div class="menu-status" id="status" aria-label="Progress"></div>
</nav>

<div class="banner" id="storage-warning" role="alert" hidden>
  This browser won't let a local file keep data, so your answers will vanish when this tab closes.
  Use <button type="button" class="link-btn" data-action="backup">Backup all data</button> often, or open the file in Chrome.
</div>

<main id="main" tabindex="-1">
  <div id="view"></div>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<input type="file" id="file-pack" accept="application/json,.json" hidden>
<input type="file" id="file-restore" accept="application/json,.json" hidden>

<script type="application/json" id="stack-data">{{DATA}}</script>
<script>
{{CORE}}
</script>
<script>
{{APP}}
</script>
</body>
</html>
