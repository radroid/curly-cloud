 just plausible answers."},{"id":"ai-016","topic":"ai","type":"scenario","depth":2,"prompt":"A demo lands well with leadership. Each session costs about $0.09 in inference, product expects 400,000 sessions a month, and the feature is not tied to revenue. The CEO wants it in the next release: what do you do?","hint":"Do the math out loud, then say what you would try before saying yes or no.","followUps":["Which levers come first: caching, a smaller model, precomputing, or cutting scope?","When you recommended against the Pinhous recommendations POC, what did you write down so someone could revisit it as prices fell?","What price or traffic number would flip your answer?"],"why":"How he reasons about unit economics for LLM features and how he frames a no."},{"id":"ai-017","topic":"ai","type":"story","depth":2,"prompt":"In regdocs your eval harness justified an embedding upgrade on hit@8 moving from 95.7% to 96.7%. Tell me how that decision went: why was one point enough, and what did the upgrade cost you?","hint":"Situation · what you compared · why the gain mattered · what it cost in storage, latency or re-embedding · what you would do differently.","followUps":["Recall@8 moved from 82.6% to 86.0% in the same change. Which number actually convinced you?","How did storing half-precision vectors in pgvector factor into the decision?","How many queries is one point of hit@8 on your golden set, and how do you know it is not noise?"],"why":"How he reads small metric gains and whether he weighs statistical noise against cost."},{"id":"ai-018","topic":"ai","type":"scale","depth":2,"prompt":"Since you rolled out Claude Code and Copilot at Eddy, how much has the team's output actually changed?","scale":{"min":1,"max":5,"minLabel":"Barely moved","maxLabel":"Night and day"},"hint":"Separate what you can measure from what it feels like.","followUps":["Who adopted it fastest, and who resisted?","What got worse, if anything: review load, code quality, how well people understand their own code?","What would you do differently in the first week of the next rollout?"],"why":"His honest assessment of AI coding tools on a real team, beyond the hype."},{"id":"ai-019","topic":"ai","type":"rapid","depth":1,"prompt":"The most overhyped idea in AI engineering right now, in a few words.","hint":"Gut answer, then defend it.","followUps":["And the most underrated?"],"why":"His contrarian instincts about the field."},{"id":"ai-020","topic":"ai","type":"open","depth":3,"prompt":"Someone acts on a wrong answer from a system you built, and it costs them. Where does the responsibility sit: with you, the model provider, or the person who trusted it?","hint":"Picture an engineer acting on an Assess answer at Eddy, or a licensing team reading regdocs.","followUps":["What do you build into a system because you accept that responsibility?","Does a disclaimer in the UI change your answer?","What would you do in the first 24 hours after finding out?"],"why":"His sense of ownership and accountability for AI systems whose outputs people act on."},{"id":"leadership-001","topic":"leadership","type":"open","depth":1,"prompt":"Think of the best lead you've ever worked under. What's the one habit of theirs you stole?","hint":"Name the habit concretely: a ritual, a phrase, a way of reviewing or running a meeting.","followUps":["What's a habit from a weaker lead that you've caught yourself repeating?","Would that person recognise the habit in how you lead now?"],"why":"Where his leadership style comes from and which behaviours he consciously models."},{"id":"leadership-002","topic":"leadership","type":"scale","depth":1,"prompt":"Once you've handed a piece of work to someone, how tightly do you hold on?","scale":{"min":1,"max":5,"minLabel":"Close to every detail","maxLabel":"Goal only, see you at the demo"},"hint":"Think of the last thing you delegated, not the ideal.","followUps":["What kind of work do you find hardest to hand over?","Tell me about a time you took something back. What made you do it?"],"why":"His default delegation style and where he struggles to let go."},{"id":"leadership-003","topic":"leadership","type":"open","depth":1,"prompt":"What's the one question you ask in almost every 1:1?","hint":"The actual words you use, not the idea behind them.","followUps":["What do you do when someone answers 'all good' every single week?","Whose agenda is the 1:1, yours or theirs?","What do you do differently in a 1:1 with someone who is struggling?"],"why":"How he runs 1:1s and what he pays attention to in the people he leads."},{"id":"leadership-004","topic":"leadership","type":"story","depth":2,"prompt":"At Duit you were an Associate Software Engineer, early in your career, and already leading a remote team of 3. Tell me about a week when keeping that team moving was genuinely hard.","hint":"Situation · what you did · what happened · what you would do differently now.","followUps":["With no shared office, what held the team together day to day: standups, docs, chat, something else?","What did you have to figure out about leading that nobody had taught you yet?","How much did your title matter to how the team treated your decisions?"],"why":"How he led before he had seniority, and which early lessons stuck."},{"id":"leadership-005","topic":"leadership","type":"open","depth":2,"prompt":"You were promoted from Application Developer to Lead at ARO in January 2023. What's one thing you had to stop doing once you were the lead?","hint":"Think about how your calendar, your time in the code and your conversations changed.","followUps":["What do you think actually earned you the promotion?","Did any working relationship on the team have to change after it? How?","What did you keep doing that, looking back, you should have dropped?"],"why":"How he understands the shift from individual contributor to lead."},{"id":"leadership-006","topic":"leadership","type":"scenario","depth":2,"prompt":"Sprint planning at Pinhous scale: 12 developers, a two-week sprint, and three stakeholders who each insist their item is the top priority. Together those three items are about twice the team's capacity. How do you run the next hour?","hint":"Minute by minute: who is in the room, what is on the screen, and how it ends.","followUps":["Who gets told no, and who delivers that message?","How much of the sprint do you leave unplanned for bugs and interruptions?","How much of this negotiation does the team see, and what do you keep off their plate?"],"why":"How he prioritizes under competing demands and protects a team while wearing both product and engineering hats."},{"id":"leadership-007","topic":"leadership","type":"this-or-that","depth":2,"prompt":"Code review with 12 developers shipping at Pinhous. Which was closer to how you ran it?","options":["Every PR went through me","Peers reviewed, I spot-checked"],"hint":"Think about a typical PR, from opened to merged.","followUps":["What's a review comment you left so often it became a team standard?","What did you do when two engineers kept blocking each other in review?","How long did a PR usually wait for a review, and did that bother you?"],"why":"How he balances control and trust, and whether he uses review to teach or to gatekeep."},{"id":"leadership-008","topic":"leadership","type":"story","depth":2,"prompt":"Tell me about one engineer you mentored on design patterns or coding standards at Pinhous, and what actually changed in their work.","hint":"Situation · what you did · what happened · what you would do differently.","followUps":["What did you try first that did not work?","How did you know it had landed: a PR, a question they stopped asking, something else?","What would they say was your most annoying mentoring habit?"],"why":"How he grows engineers and what effective mentoring looks like to him in practice."},{"id":"leadership-009","topic":"leadership","type":"this-or-that","depth":2,"prompt":"At Pinhous you were Product Lead and also owned the architecture. When the two hats disagreed, which one usually won?","options":["The product hat","The engineering hat"],"hint":"Think of one specific call where they pulled in different directions.","followUps":["Name one decision where the losing hat should have won.","Would you take a role that combines both again, or would you rather split them?"],"why":"Which instinct dominates when product and engineering priorities pull apart."},{"id":"leadership-010","topic":"leadership","type":"open","depth":2,"prompt":"At Create Club the clients paying you could overrule you on anything. How do you lead a project when the final say belongs to someone else?","hint":"Pick one client engagement and describe what you did in the first two weeks.","followUps":["What did you insist on in every engagement, even when the client did not ask for it?","Tell me about a time a client overruled you and turned out to be right.","How is leading work through a consultancy, as with the beverage-company agents, different from leading with a direct client?"],"why":"How he leads through influence when he holds neither the budget nor the final word."},{"id":"leadership-011","topic":"leadership","type":"scenario","depth":2,"prompt":"Imagine it's three weeks after the Eddy work tracker replaced the shared Excel sheet. A group of field technicians still send updates by text and email, their manager doesn't report to you, and items are starting to get lost again. What do you do?","hint":"Your first move, and who you talk to first.","followUps":["What would you change in the product, and what in the process?","When is it right to switch off the old way entirely?","How do you change the habits of a third-party vendor when you have no contract leverage?"],"why":"How he drives adoption and leads without authority across teams, field staff and vendors."},{"id":"leadership-012","topic":"leadership","type":"story","depth":3,"prompt":"Tell me about rolling out Claude Code and GitHub Copilot to the engineering team at Eddy, focusing on whoever took longest to come around (no names needed).","hint":"Situation · what you did · what happened · what you would do differently.","followUps":["What was their objection in their own words, and was any of it right?","What norms did you set so AI-written code did not lower the bar in review?","How do you tell real adoption apart from people just having a licence?"],"why":"How he drives change and earns buy-in for new tools rather than mandating them."},{"id":"leadership-013","topic":"leadership","type":"scenario","depth":3,"prompt":"You lead a team of 6. One engineer, well liked and solid last quarter, has missed three sprint commitments in a row, and two teammates have quietly started picking up the slack. What do you do this week?","hint":"Describe the first conversation: where it happens and what you say in the first minute.","followUps":["What changes if they tell you something personal is going on?","At what point do your manager or HR get involved, and how does the engineer find out?","What do you say to the two teammates who have been covering?"],"why":"How he handles underperformance: directness, empathy and fairness to the rest of the team."},{"id":"leadership-014","topic":"leadership","type":"open","depth":3,"prompt":"How would you know, concretely, whether the most junior engineer on your team would tell you straight away that they broke production?","hint":"The signals you would look for, and what you have actually done to earn that trust.","followUps":["What do you do in the first five minutes after someone admits a mistake?","Have you ever made a team feel less safe without meaning to? What happened?"],"why":"How he builds psychological safety in practice, beyond saying the words."},{"id":"conflict-001","topic":"conflict","type":"scenario","depth":2,"prompt":"A senior engineer with ten more years than you blocks your PR in review with \"this is not how we do things here\", no further detail. The feature is due tomorrow. What do you do in the next hour?","hint":"Walk through your actual first message to them.","followUps":["What if they were right and you only realised afterwards?","When do you escalate, and to whom?","Has a version of this actually happened to you? How did it go?"],"why":"How he handles hierarchy and vague pushback under time pressure."},{"id":"conflict-002","topic":"conflict","type":"this-or-that","depth":1,"prompt":"A colleague says something in a team meeting that you think is flat-out wrong. Your instinct?","options":["Say so in the meeting","Raise it one-on-one after"],"hint":"Answer with what you actually did the last time, not what you would advise.","followUps":["Does it change if the person is your manager, or a client?","When have you regretted waiting, or regretted speaking up?"],"why":"His default for public versus private disagreement."},{"id":"conflict-003","topic":"conflict","type":"scale","depth":1,"prompt":"How long is your fuse at work?","scale":{"min":1,"max":5,"minLabel":"Short, and people can tell","maxLabel":"Very long, maybe too long"},"hint":"Rate yourself the way your teammates would, not the way you would like to be.","followUps":["What's the fastest way for someone to burn through it?","What does it look like from the outside when it finally runs out?"],"why":"What tests his patience and how visible his frustration is to others."},{"id":"conflict-004","topic":"conflict","type":"this-or-that","depth":1,"prompt":"A PM hands you requirements that are genuinely ambiguous, and they are in back-to-back meetings all week. Your default move?","options":["Build a rough cut and show it","Pin them down before building"],"hint":"Think of the last fuzzy spec you were handed.","followUps":["When has your default backfired?","How do you push back on a spec without making the PM feel attacked?","You have been a Product Lead yourself. What do you wish engineers had asked you more often?"],"why":"How he handles ambiguous requirements with product partners, and whether he leans towards action or clarification."},{"id":"conflict-005","topic":"conflict","type":"open","depth":2,"prompt":"What's the most useful piece of feedback you've ever received that stung at the time?","hint":"Roughly who said it, roughly what they said, and what you changed afterwards.","followUps":["What was your first reaction in the moment, honestly?","Is there feedback you have heard more than once and still not acted on?"],"why":"How he receives criticism and whether he turns it into change."},{"id":"conflict-006","topic":"conflict","type":"scenario","depth":2,"prompt":"In a demo to leadership, a teammate presents the retrieval fix you spent two weeks on as 'something we figured out', and the VP thanks them by name. You're in the room. What do you do, there and afterwards?","hint":"Separate what you do in the room from what you do later that day.","followUps":["Does anything change if they are a junior engineer rather than a peer?","How much does credit matter to you, honestly?","Could you have been on the other side of this without noticing?"],"why":"How he handles credit, fairness and ego on a team."},{"id":"conflict-007","topic":"conflict","type":"scenario","depth":2,"prompt":"Say a Create Club client, two weeks before launch, asks for a feature that would push the date by three weeks. Their CEO has already promised it to a partner, and the contract is fixed-price. What do you say on the call?","hint":"Write out your first two sentences.","followUps":["What would make you say yes and absorb the cost?","How did you actually handle scope creep at Create Club, as opposed to in theory?","What do you put in writing at the start of an engagement to make this conversation easier?"],"why":"How he negotiates scope and pushback with paying clients without damaging the relationship."},{"id":"conflict-008","topic":"conflict","type":"story","depth":2,"prompt":"Your LangChain recommendations proof of concept at Pinhous worked, and you still recommended against shipping it on cost. Tell me about the conversation where you made that recommendation.","hint":"Situation · what you said and showed · how it landed · what you would do differently.","followUps":["Who most wanted it shipped, and what was their best argument?","How do you make a cost argument land with people who have just seen a working demo?","How do you shelve something that works without deflating the people who built it?"],"why":"How he delivers unwelcome recommendations to decision-makers and holds a position against a working demo."},{"id":"conflict-009","topic":"conflict","type":"open","depth":2,"prompt":"When a conversation at work gets heated, what does repair look like for you afterwards?","hint":"Think of a real one: the next message you sent, or the conversation you had the next day.","followUps":["Who usually makes the first move, you or them?","Is there a working relationship you never fully repaired? What would you do now?"],"why":"How he recovers relationships after conflict and whether he takes the first step."},{"id":"conflict-010","topic":"conflict","type":"open","depth":3,"prompt":"At Create Club you costed an IMAP MCP server for a client and recommended stopping at the prototype, which may also have meant less paid work for your own studio. How did you frame that recommendation to the client?","hint":"What you showed them, the numbers you used, and the words you chose.","followUps":["Did the conflict of interest cross your mind, and did you name it out loud?","How did the client react, and did it change the relationship?","Would you make the same call if the studio had badly needed the revenue that month?"],"why":"Whether he puts the client's interest ahead of his own revenue, and how he says no to a paying customer."},{"id":"conflict-011","topic":"conflict","type":"story","depth":3,"prompt":"Tell me about the hardest piece of feedback you have had to give someone you worked with.","hint":"Situation · what you said, as close to word for word as you can · how they took it · what you would change.","followUps":["How long did you wait before giving it, and was that too long?","What did your working relationship look like a month later?","How do you give hard feedback upward, to someone more senior than you?"],"why":"How he gives difficult feedback: timing, directness and care."},{"id":"conflict-012","topic":"conflict","type":"open","depth":3,"prompt":"Co-founding means nobody above you breaks the tie. When the founders at Create Club disagreed on something that mattered (if you ever did), how did it actually get resolved?","hint":"Pick one real disagreement: what it was about, who moved, and why.","followUps":["What did co-founding teach you about your own conflict style?","What would you agree on in writing with a co-founder before starting next time?"],"why":"How he handles conflict between equals, where nobody has the authority to settle it."},{"id":"failure-001","topic":"failure","type":"open","depth":1,"prompt":"What is one habit you have today that exists only because something went wrong once?","hint":"A check you always run, a question you always ask, a thing you never do on a Friday.","followUps":["What was the thing that went wrong?","Has the habit ever been overkill?"],"why":"Which lessons actually changed his behaviour, not just his opinions."},{"id":"failure-002","topic":"failure","type":"this-or-that","depth":1,"prompt":"You realise something you shipped is broken, and nobody else has noticed yet. First instinct?","options":["Tell people, then fix it","Fix it fast, then tell"],"hint":"Your gut reaction, not your policy.","followUps":["Has that instinct ever cost you?","Does it change if a customer can already see the problem?"],"why":"His reflex on disclosure versus quiet repair when his own work breaks."},{"id":"failure-003","topic":"failure","type":"scale","depth":1,"prompt":"How hard are you on yourself after a mistake at work?","scale":{"min":1,"max":5,"minLabel":"Shrug and move on","maxLabel":"Replay it for weeks"},"hint":"Think about the last real one, not the ideal.","followUps":["What helps you put one down?","How do you want a lead to respond when you are the one who messed up?"],"why":"His emotional relationship with failure and what support he wants from others."},{"id":"failure-004","topic":"failure","type":"story","depth":2,"prompt":"Pick one incident that kept coming back at ARO before your preventive measures cut recurring incidents by 20%. What was it, and what finally stopped it?","hint":"Situation · what you changed (a runbook, a check, an alert, a process) · what happened · what you would do differently.","followUps":["Why had nobody fixed it properly before?","What did the incidents you could not prevent have in common?","How did you get people to actually use the documentation you owned?"],"why":"Whether he fixes root causes systematically rather than just firefighting."},{"id":"failure-005","topic":"failure","type":"scenario","depth":2,"prompt":"It's Wednesday. On Monday you told a client a feature would take 3 days. You now realise it's closer to 3 weeks, because the API you're integrating doesn't do what its docs claim. What do you do in the next hour?","hint":"Who you tell, how you tell them, and what options you bring along with the bad news.","followUps":["When has an estimate of yours actually blown up like this? What happened?","Do you pad estimates now? By how much, and do you tell people you do?"],"why":"How he communicates slipping timelines and whether his estimation habits have changed."},{"id":"failure-006","topic":"failure","type":"story","depth":2,"prompt":"Tell me about a project or technology bet that died, where at least part of the cause was a call you made.","hint":"Situation · the call you made · what happened · what you would do differently.","followUps":["Were there early signs you explained away?","How long did it take you to admit it, and what finally convinced you?","Did any of it survive into something else?"],"why":"Whether he can own his technical and product calls and how he weighs sunk cost."},{"id":"failure-007","topic":"failure","type":"this-or-that","depth":2,"prompt":"Looking back over your own mistakes, which kind shows up more often?","options":["Shipped too early","Held on too long"],"hint":"Count them honestly, across jobs and side projects.","followUps":["Give me one example of the kind you picked.","Which way does your instinct lean today, and is that an overcorrection?"],"why":"Whether his mistakes tend to skew towards rushing or towards caution."},{"id":"failure-008","topic":"failure","type":"open","depth":2,"prompt":"What's a people or team decision you made as a lead that you'd make differently today?","hint":"A hire, who you put on what, a team structure, a process you imposed.","followUps":["What did you know at the time that should have told you?","Did you ever tell the people affected that you would do it differently now?"],"why":"How he reflects on people decisions, which are harder to undo than code."},{"id":"failure-009","topic":"failure","type":"story","depth":3,"prompt":"Tell me about a production incident you personally caused. Not one you fixed: one you caused.","hint":"Situation · what you did (and did not do) · what happened · what you changed afterwards.","followUps":["How did you find out: an alert, a user, a colleague?","Who did you tell first, and how quickly?","What guardrail exists today because of it?"],"why":"How he owns his own mistakes and what safeguards he builds afterwards."},{"id":"failure-010","topic":"failure","type":"open","depth":3,"prompt":"Your regdocs eval harness caught a real regression (hit@8 fell from 96.7% to 91.3%) and you held the release. What is a regression that got past you before you worked that way?","hint":"What slipped through, how it was noticed, and how long it had been live.","followUps":["What would have caught it, if you had had it at the time?","What kind of failure would your current eval setup still miss?"],"why":"Whether he is honest about the limits of his testing and what drove his eval-first habits."},{"id":"failure-011","topic":"failure","type":"scenario","depth":3,"prompt":"You ship a change on Friday afternoon. On Monday morning you learn it has been silently misclassifying about 5% of a customer's documents all weekend, and the customer noticed before anyone on your team did. Walk me through your Monday.","hint":"The order you do things in (tell, contain, fix, investigate) and who hears what from you.","followUps":["What goes in the postmortem, and is anyone named in it?","How much do you tell the customer about the cause?","How do you avoid overcorrecting with process nobody will follow?"],"why":"His ownership, communication under pressure and postmortem style when a mistake reaches a customer."},{"id":"failure-012","topic":"failure","type":"open","depth":3,"prompt":"What is the most expensive lesson co-founding Create Club taught you about running a business, as opposed to building software?","hint":"Pricing, clients, partnership, cash, time: pick the one that cost the most.","followUps":["What would you do differently in the first three months if you started it again?","What did it teach you about yourself as a founder versus as an employee?","What do you do differently inside a company now because you once helped run one?"],"why":"What running a studio taught him and how it shapes the way he works inside companies now."},{"id":"work-style-001","topic":"work-style","type":"this-or-that","depth":1,"prompt":"When does your best thinking happen?","options":["Early morning","Late at night"],"hint":"When did you last write something you were proud of?","followUps":["What does your ideal workday look like, hour by hour?","How do you protect those hours when the rest of the team keeps different ones?"],"why":"His energy rhythm and when he does his deepest work."},{"id":"work-style-002","topic":"work-style","type":"this-or-that","depth":1,"prompt":"You worked remotely from Mumbai at Duit and led a remote team there. If you had to pick one setup for the next three years, which would it be?","options":["Fully remote","In the office most days"],"hint":"Pick one even if the honest answer is hybrid; the why is where the nuance goes.","followUps":["What does remote work get wrong that people rarely admit?","What would a good hybrid week look like for you, day by day?"],"why":"His real preference on location and what he thinks each setup costs."},{"id":"work-style-003","topic":"work-style","type":"open","depth":1,"prompt":"If you could impose one rule on every meeting at your company, what would it be?","hint":"A rule you would actually enforce, not a slogan.","followUps":["Which recurring meeting would you kill first?","What should always be a written doc instead of a meeting?"],"why":"His meeting philosophy and how he wants collaboration to run."},{"id":"work-style-004","topic":"work-style","type":"scale","depth":1,"prompt":"How async do you want your team to be?","scale":{"min":1,"max":5,"minLabel":"Talk it through live","maxLabel":"Write it down, reply later"},"hint":"Think about a normal week, not a crisis.","followUps":["What should never be handled async?","How long is too long to wait for a reply to a message?"],"why":"His default communication mode and what he expects from teammates."},{"id":"work-style-005","topic":"work-style","type":"open","depth":2,"prompt":"It's Monday morning. How do you plan the week ahead?","hint":"When you do it, where the plan lives, and how much of it usually survives to Friday.","followUps":["What always gets bumped first?","How do you balance your own deep work against unblocking the team?"],"why":"How he organizes his time and protects focus while leading."},{"id":"work-style-006","topic":"work-style","type":"scale","depth":2,"prompt":"What pace do you do your best work at?","scale":{"min":1,"max":5,"minLabel":"Steady, every single day","maxLabel":"Intense sprints, then recover"},"hint":"Think about the last three months, not your best week.","followUps":["How long can you sustain a sprint before quality slips?","How do you work with teammates whose pace is the opposite of yours?","One-week sprints, two-week sprints or none at all: what has worked best for your teams?"],"why":"His natural work rhythm and how it fits a team cadence."},{"id":"work-style-007","topic":"work-style","type":"this-or-that","depth":2,"prompt":"Starting a new project, which would you rather be handed?","options":["A problem and a deadline","A clear spec and a plan"],"hint":"Think of the project where you did your best work.","followUps":["When has too much freedom hurt you?","What is the minimum structure you want even when you have a free hand?"],"why":"How much structure he needs to do his best work."},{"id":"work-style-008","topic":"work-style","type":"open","depth":2,"prompt":"You built the Eddy team an app to record its engineering decisions. What does your own system for notes and decisions look like day to day?","hint":"Tools, format, and where a decision from three months ago would be found.","followUps":["What makes a decision worth writing down?","What happens to your notes after a meeting?","Which tool on your desk would be hardest to give up?"],"why":"How he documents his thinking and whether others can find the reasoning behind his calls."},{"id":"work-style-009","topic":"work-style","type":"story","depth":2,"prompt":"Tell me about the most energizing stretch of work you have had in the last few years, the kind where you lost track of time.","hint":"Situation · what you were doing · what made it work · how you would recreate it.","followUps":["What was missing from it: meetings, interruptions, something else?","Now the opposite: what was in the most draining stretch you have had?"],"why":"What energizes and drains him, so the clone can describe the environments where he thrives."},{"id":"work-style-010","topic":"work-style","type":"scenario","depth":2,"prompt":"It's Tuesday, the one day this week you blocked for deep work on a gnarly retrieval bug. At 8:45am your manager adds you to an all-day planning workshop starting at 10. What do you do?","hint":"Your actual reply to the invite, and what happens to the bug.","followUps":["What would make you decline outright?","How would you want a manager to handle it instead?","If you go, how do you get the deep-work day back?"],"why":"How he protects focus time and negotiates with his manager."},{"id":"work-style-011","topic":"work-style","type":"scenario","depth":2,"prompt":"Monday is your first day at a new company. There's no onboarding doc, your manager is travelling all week, and the only thing on your calendar is the team standup. How do you spend the week?","hint":"Day by day: who you talk to, what you read, and what you try to ship by Friday.","followUps":["What do you want to have written down by Friday, and for whom?","What would a great first week have looked like, if someone had planned it for you?","How did your first weeks at Eddy actually go?"],"why":"How he ramps up in a new environment when nobody is steering, and how self-directed he is."},{"id":"work-style-012","topic":"work-style","type":"open","depth":2,"prompt":"How do you want to be told your work isn't good enough?","hint":"Channel, timing, how blunt, and what you need to hear alongside it.","followUps":["Who gave you feedback in exactly the right way, and what did they do?","What delivery makes you shut down?"],"why":"How to give him feedback that lands."},{"id":"work-style-013","topic":"work-style","type":"story","depth":3,"prompt":"You describe how you work as focused deep dives: one problem, a few weeks, all the way to the bottom, then ship. Tell me about your most recent one, start to finish.","hint":"Situation (the problem) · how you went deep · what you shipped · what you carried into the next thing.","followUps":["What does day three of a deep dive look like: tabs, notes, what you stop doing?","How do you know a deep dive is done, and not just stalled?","How do you go that deep and still stay useful to a team that needs you?"],"why":"What his signature working mode looks like in practice, and what it gives and costs a team."},{"id":"work-style-014","topic":"work-style","type":"open","depth":3,"prompt":"Write the three-line job description for your ideal manager.","hint":"Three lines of concrete behaviour, no adjectives like \"supportive\".","followUps":["What has a manager done that made you want to leave?","How do you manage up when your manager does not fit that description?"],"why":"What he needs from a manager and what drives him away."},{"id":"work-style-015","topic":"work-style","type":"scenario","depth":3,"prompt":"It's 2:07am and you're on call. A page says ingestion from the device fleet has stopped: the queue is backing up, and the dashboards customers rely on will be stale by morning. You didn't write the service, and its runbook is a year old. Walk me through the first 30 minutes.","hint":"Minute by minute: what you open first, what you check, and who you wake up and when.","followUps":["What is your threshold for waking someone else up?","What do you do at 10am the next day, after some sleep?","What would you change so the next 2am page is shorter?"],"why":"His incident instincts, calm under pressure and judgement about when to escalate."},{"id":"career-001","topic":"career","type":"rapid","depth":1,"prompt":"Describe your dream job title in five words or fewer.","hint":"It does not have to exist yet.","followUps":["Does anyone have that title today?","What would you actually do in your first week?"],"why":"The shorthand for his ambition, in his own words."},{"id":"career-002","topic":"career","type":"open","depth":2,"prompt":"Out of everything you could specialise in, why AI engineering, and why now rather than two years ago or two years from now?","hint":"What about this particular moment pulls you in?","followUps":["What part of AI engineering do you find genuinely boring?","What would make you walk away from AI and build something else entirely?"],"why":"His authentic reason for choosing AI engineering, beyond it being the hot field."},{"id":"career-003","topic":"career","type":"this-or-that","depth":1,"prompt":"Which stage of a company gets the best out of you?","options":["Finding product-market fit","Scaling something that works"],"hint":"Pinhous and Create Club on one side, Eddy on the other.","followUps":["What is the most useful thing you do at the stage you did not pick?","Which stage are you worst at, honestly?"],"why":"The company stage he thrives in, which the clone uses when assessing fit."},{"id":"career-004","topic":"career","type":"open","depth":3,"prompt":"It's 2030. What are you working on, who are you working with, and what does a Tuesday look like?","hint":"Be concrete: the problem, the team size, the city, the kind of room you are sitting in.","followUps":["What has to happen in the next 12 months for that to be on track?","Is there a founder in that picture?","What is conspicuously missing from it?"],"why":"His three-to-five-year vision, including whether he sees himself founding again."},{"id":"career-005","topic":"career","type":"this-or-that","depth":2,"prompt":"You've led a team of 12 at Pinhous and a remote team of 3 at Duit. For the next five years, which path?","options":["Hands-on technical lead","Managing managers"],"hint":"Think about which weeks at Pinhous felt best, and why.","followUps":["What would a company have to offer to make you pick the other one?","What is the least amount of code you could write in a week and still be happy?"],"why":"His preferred career track, and how much hands-on building he needs."},{"id":"career-006","topic":"career","type":"open","depth":2,"prompt":"Describe the team you do your best work in. Not the perks: the people, and how they behave on an ordinary Wednesday afternoon.","hint":"Think back to the stretches at ARO, Pinhous, Create Club or Eddy when you were most in flow.","followUps":["What is one behaviour that would make you quietly start looking elsewhere?","How does that team handle someone being wrong in public?"],"why":"The culture and team dynamics he thrives in, which the clone uses to judge fit."},{"id":"career-007","topic":"career","type":"scale","depth":1,"prompt":"What size of company brings out your best work?","scale":{"min":1,"max":5,"minLabel":"Five people in a room","maxLabel":"Thousands, with real process"},"hint":"You have seen a small studio, a startup with a 12-person dev team, and a hardware company with a 150,000-device fleet.","followUps":["What do you lose at the size you picked?","Does the answer change if AI is the core product rather than a side bet?"],"why":"His preferred company size, a hard input when the clone assesses a role."},{"id":"career-008","topic":"career","type":"open","depth":3,"prompt":"What are your real dealbreakers, the things that would make you turn down an otherwise great offer?","hint":"Things you have learned the hard way, not things that sound good in an interview.","followUps":["Which one did you learn from a specific experience?","Have you ever compromised on one and regretted it?"],"why":"The hard constraints the clone should apply when assessing role fit."},{"id":"career-009","topic":"career","type":"open","depth":2,"prompt":"If a recruiter asks about compensation on a first call, how do you actually answer?","hint":"The philosophy you would say out loud, not a number.","followUps":["After co-founding a studio, how do you weigh equity against salary?","What would you trade salary for, and what would you never trade it for?"],"why":"His public-facing compensation philosophy, so the clone can answer without inventing numbers."},{"id":"career-010","topic":"career","type":"scenario","depth":2,"prompt":"You've got 60 seconds in an elevator with a hiring manager who has read your resume but never met you. What do you want them to understand about you that the resume can't show?","hint":"Imagine they have read every bullet and still do not get it.","followUps":["What do people usually get wrong about you from the resume alone?","How would you prove it in your first two weeks?"],"why":"The self-pitch he most wants the clone to carry to hiring managers."},{"id":"career-011","topic":"career","type":"scenario","depth":3,"prompt":"Two offers land the same week: a well-funded 30-person AI startup offering 20% more cash for a vague role ('you'll figure it out'), and a steady company offering similar pay for full ownership of their GenAI platform with a clear mandate. You have 72 hours. How do you decide?","hint":"Say what you would ask each of them before deciding.","followUps":["What single question would you ask the startup CTO?","What would flip your answer?","How much does the team you would work with outweigh the role itself?"],"why":"How he evaluates a job offer in practice, and which factors actually dominate."},{"id":"career-012","topic":"career","type":"scenario","depth":2,"prompt":"Your old site offered a one-week pilot project to any company you were serious about joining. A company you like accepts and hands you a vague brief on Monday. What do you build by Friday, and how do you make the week tell both sides something real?","hint":"Start with what you would ask in the first 30-minute call.","followUps":["Would you still make that offer today, as a Lead?","What does a pilot week reveal about a company that interviews never do?"],"why":"How he proves value through real work and evaluates a company from the inside."},{"id":"career-013","topic":"career","type":"story","depth":2,"prompt":"Tell me about a moment at work when you thought 'this is exactly what I should be doing'.","hint":"Situation · what you were doing · what happened · what you'd want more of.","followUps":["What specifically made it: the problem, the people, or the stakes?","How do you shape a role so that happens more often?"],"why":"The kind of work that energises him most, a strong signal for which roles fit."},{"id":"career-014","topic":"career","type":"scale","depth":3,"prompt":"How likely is it that you start another company in the next five years?","scale":{"min":1,"max":5,"minLabel":"Very unlikely","maxLabel":"Already sketching it"},"hint":"Create Club taught you something about this, either way.","followUps":["What would the company have to be about?","What would need to be true in your life to make the leap again?"],"why":"His founder ambition, which shapes how he frames long-term roles."},{"id":"career-015","topic":"career","type":"this-or-that","depth":3,"prompt":"You have a Technical Product Management certificate from BrainStation, you have held Product Lead as a title, and in 2026 your site listed both Full-Stack AI Developer and AI Product Manager. Which one are you, really?","options":["Engineer who thinks in product","Product leader who can build"],"hint":"Think about which half of the work you would keep if you could only keep one.","followUps":["In 2025 you wrote that generalists become the premium asset as AI commoditises specialists. Does that still shape the roles you go for?","What would a job that fully used both halves look like?"],"why":"Where he sits between engineering and product, and whether he sees himself as a generalist."},{"id":"career-016","topic":"career","type":"open","depth":2,"prompt":"You carry what you learn in one deep dive into the next domain. If you could choose the next domain to be dropped into, what would it be?","hint":"Your headline says agent orchestration. Is that it, or is there something further out?","followUps":["What have you already done to get started on it?","Who is doing the most interesting work there right now?"],"why":"His next learning target, which signals where his career is heading."},{"id":"stories-001","topic":"stories","type":"story","depth":3,"prompt":"The Eddy work tracker replaced a shared Excel sheet where items were routinely lost, and it had to work for Service, Product, Tech, field technicians and outside vendors. Tell me how you got each of those groups to actually move off the sheet.","hint":"Situation · who was hardest to move and why · what you built or changed for them · what happened · what you would do differently.","followUps":["What was the moment you knew the Excel sheet was really dead?","What did field technicians need that the office teams did not?","Which feature request did you turn down, and how did you say no?"],"why":"How he drives adoption of an internal tool across very different users, not just how he builds it."},{"id":"stories-002","topic":"stories","type":"story","depth":3,"prompt":"Tell me the story of designing auth for the Eddy MCP server, where every tool call resolves to a real person and is checked against the tracker's own role and visibility rules. Where did you start, and what pushed you to this design?","hint":"Situation · the simpler option you considered · where it would have gone wrong · what you built · what you would change.","followUps":["Did anyone argue for a single shared API key, and what was your answer?","How are personal access tokens issued, rotated and revoked?","What does the maintainer bot do unattended over stdio, and how is its access scoped?"],"why":"The real design history behind his MCP auth model, including the trade-offs he rejected."},{"id":"stories-003","topic":"stories","type":"story","depth":3,"prompt":"Tell me how the Eddy RAG over engineering docs ended up with two modes, Explain and Assess, and an Inspect AI suite that has to pass before any change ships. What were engineers actually asking for, and what does Assess do that Explain can't?","hint":"Situation · why one mode was not enough · how the eval gate works · what it has caught so far · what you would do differently.","followUps":["Has the gate ever blocked a change you wanted to ship? What happened?","How did you decide the pass threshold?","Who writes new eval cases when the docs change?"],"why":"How he designs RAG around real user intents and wires evaluation into the release process."},{"id":"stories-004","topic":"stories","type":"story","depth":2,"prompt":"Your Eddy tools turn telemetry from 150,000+ LoRaWAN devices, arriving through Azure Storage Queues, into insights for customers and field teams. Tell me about a time the data surprised you: a backlog, part of the fleet going quiet, or numbers that looked wrong.","hint":"Situation · how you noticed · what was really going on · what you changed · what you would monitor now.","followUps":["How do you tell a dead device from a quiet one?","What do the Python commissioning scripts do, and what happens when one fails in the field?","Who notices first when something breaks: you, a customer or a field tech?"],"why":"How he operates a high-volume IoT data path and debugs data problems that start in the physical world."},{"id":"stories-005","topic":"stories","type":"story","depth":1,"prompt":"Within your first month at Eddy you rolled out Claude Code and Copilot and shipped an app the team now uses to record its engineering decisions. Tell me the story of that app: where the idea came from and how it went from your laptop to something the team uses.","hint":"Situation · the problem it solved · how you built it and with what · the first real decision recorded · what you would change.","followUps":["How much of it did Claude Code write?","Was it partly a demonstration of what the tools could do for the team?","What is a decision the team recorded that later mattered?"],"why":"How he builds momentum early in a new role and uses a small, real tool to show what AI-assisted development can do."},{"id":"stories-006","topic":"stories","type":"story","depth":3,"prompt":"Your agents for the global beverage company replaced 80+ manual weekly processes and cut manual work by about 60%. Tell me about the worst week those agents had: what failed, who noticed, and how you fixed it.","hint":"Situation · what failed (a report format, a model, a load step) · how it surfaced · what you did · what you would build differently.","followUps":["What made up the manual work that remained after the 60% cut?","How did the weekly report formats change under you, and how did the agents cope?","What did working through a consultancy make easier or harder?"],"why":"What production agent failures really look like to him, and how he builds for recovery."},{"id":"stories-007","topic":"stories","type":"story","depth":2,"prompt":"You prototyped an MCP server over a client's self-hosted IMAP mail, measured the tool latency, showed it needed a local index and a response cache, costed it and recommended stopping. Tell me about the conversation where you told the client.","hint":"Situation · what the numbers were · how you framed stopping · how they reacted · what you would do differently.","followUps":["What latency did you measure, and what would acceptable have looked like?","Was there any pull to keep going, given that stopping meant less work for the studio?","What did the client do instead?"],"why":"How he delivers a data-backed stop recommendation, even when it costs him work."},{"id":"stories-008","topic":"stories","type":"story","depth":2,"prompt":"Across the 10+ client apps you shipped at Create Club, tell me about the hardest engagement. What made it hard, and how did it end?","hint":"Situation · what made it hard (scope, trust, money, people) · what you did · how it ended · what you would do differently. No names needed.","followUps":["What would you now put in the contract or the kickoff to prevent it?","Was there a moment you considered walking away?","How did being a co-founder change the way you handled it?"],"why":"How he manages a difficult client relationship as a founder with skin in the game."},{"id":"stories-009","topic":"stories","type":"story","depth":2,"prompt":"At Pinhous you built a Docker and infrastructure-as-code pipeline on AWS that cut deploys from 15 minutes to 2, with health monitoring and automated rollbacks. Tell me where the 13 minutes went and how you found them.","hint":"Situation · what the old deploy looked like · what you measured · what you changed first · what you would do differently.","followUps":["Did an automated rollback ever fire for real? What happened?","How did the habits of 12 developers change once a deploy took 2 minutes?","Which infrastructure-as-code tool did you pick, and would you pick it again?"],"why":"How he diagnoses a delivery bottleneck and what fast, safe deploys changed for his team."},{"id":"stories-010","topic":"stories","type":"story","depth":2,"prompt":"You introduced Kafka at Pinhous for event-driven data flow between services. Tell me how it went from your idea to running in production: did anyone need convincing, and what was the best argument against it?","hint":"Situation · the problem Kafka solved · the pushback · how you won the argument or compromised · what you would do differently.","followUps":["Looking back, was Kafka the right size of tool for Pinhous?","What broke first once it was in production?","Who ended up owning it day to day?"],"why":"How he introduces significant infrastructure and earns buy-in from a team."},{"id":"stories-011","topic":"stories","type":"story","depth":3,"prompt":"Your LangChain proof of concept for home recommendations at Pinhous worked, and you still recommended against shipping it because per-user inference cost did not justify it. Tell me about delivering that recommendation: who wanted it shipped, and how did they take it?","hint":"Situation · what the POC showed · the cost math · how you made the call · how it landed · what you documented for later.","followUps":["What were the actual numbers: cost per user and expected traffic?","Was it hard to argue against your own working prototype?","Has the trade-off flipped since, given how far model prices have fallen?"],"why":"How he makes and communicates a cost-driven no on work he built himself."},{"id":"stories-012","topic":"stories","type":"story","depth":2,"prompt":"At ARO you owned on-call incident response, and your preventive measures cut recurring incidents by 20%. Tell me about the incident that taught you the most.","hint":"Situation · what broke and when · how you found the cause · the preventive fix · what you would do differently.","followUps":["What made an incident \"recurring\" in your tracking, and how did you count the 20%?","Which preventive measure had the biggest effect?","What did being on call change about the code you write now?"],"why":"How he responds to incidents and turns them into lasting prevention."},{"id":"stories-013","topic":"stories","type":"open","depth":2,"prompt":"At ARO your ML-powered document automation tripled report-generation throughput with automated extraction and NLU-based classification. If you rebuilt it today, what would you keep, what would you hand to an LLM, and what would you still refuse to?","hint":"Start with what the pipeline did and who did that work by hand before it existed.","followUps":["How did you know the extraction was right without checking every page?","Which document type was hardest to classify, and why?","How did the people who used to produce those reports by hand feel about it?"],"why":"How his pre-LLM machine learning experience shapes where he would and would not use LLMs today."},{"id":"stories-014","topic":"stories","type":"story","depth":1,"prompt":"At Duit you cut buy/sell signal latency over NSE market data from 15 seconds to 5. What was actually slow, and what did you change?","hint":"Situation · where the 15 seconds went · the change that mattered most · what you would try today.","followUps":["Why did 5 seconds matter to the people using the signals?","Did anything you tried make it slower first?","What would you reach for now that you did not know about then?"],"why":"His earliest performance work and how he finds bottlenecks."},{"id":"stories-015","topic":"stories","type":"story","depth":2,"prompt":"Early in your career at Duit, you led a remote team of 3 building Cloud Functions, IAM and the data pipelines behind real-time dashboards. Tell me about a week on that team when things were not going well: what was wrong, and what did you do about it?","hint":"Situation · what was going wrong · what you tried · what worked · what you would do differently with what you know now.","followUps":["How did you run a remote team in 2020 and 2021 without the habits and tools you rely on now?","Did the team know you were new to leading?","What did you get wrong then that you still watch for?"],"why":"How he first learned to lead, remotely and early in his career."},{"id":"stories-016","topic":"stories","type":"story","depth":3,"prompt":"When the regdocs corpus grew, your evals caught hit@8 dropping from 96.7% to 91.3%, with 15 queries worse and none better. You recovered half the loss and still held the production release pending a generation eval. Tell me about the moment you decided to hold.","hint":"Situation · what you saw first · how you root-caused it · the case for shipping anyway · why you held · what you would do differently.","followUps":["Nobody was forcing you to hold a solo project. Why did it matter?","What does the generation eval have to show before you release?","How did you find the boilerplate collision: from the data, the failing queries or a hunch?"],"why":"His release discipline when metrics regress, and how he root-causes a retrieval failure."},{"id":"stories-017","topic":"stories","type":"story","depth":2,"prompt":"To grow the regdocs corpus you built a licence-manifest fetcher: 15 US NRC guides validated but held from ingestion, and 16 IAEA standards catalogued as reference-only. Tell me how you ended up spending time on licensing instead of just ingesting everything.","hint":"Situation · what you discovered about the licences · the call for each source · what it cost you · what you would do differently.","followUps":["Why hold the NRC guides until citations are source-aware? What would go wrong otherwise?","How did you work out what the IAEA licence allowed?","Would you apply the same rigor at a startup moving fast?"],"why":"How he handles licensing, provenance and trust in data, even when nobody is checking."},{"id":"stories-018","topic":"stories","type":"story","depth":1,"prompt":"In jobsearch you parsed queries into structured intent with an LLM, negations included, and applied a negation penalty after fusion. What did a query like 'remote data jobs, not in finance' return before you handled negation?","hint":"Situation · the query that broke it · why embeddings struggle with \"not\" · what you built · what you would do differently.","followUps":["Why a penalty rather than a hard filter?","How did conversational refinement handle a follow-up like \"actually, finance is fine\"?","How did you test that negation handling worked?"],"why":"How he debugs a classic embedding weakness and designs around it pragmatically."},{"id":"life-001","topic":"life","type":"rapid","depth":1,"prompt":"What's the last song you had on repeat?","hint":"Artist and track. No judgement.","followUps":["Where were you when it got stuck in your head?","Is it typical of your taste or a total outlier?"],"why":"A current, specific music detail that makes the clone feel human."},{"id":"life-002","topic":"life","type":"open","depth":2,"prompt":"The Music app on your site shows what you are playing on Spotify, spinning on a vinyl record. What role does music actually play in your life, at work and away from it?","hint":"Genres, artists, rituals, and whether you can code to music with lyrics.","followUps":["Do you own any actual vinyl?","Which artist would you want the clone to be able to talk about properly?","What music takes you straight back to Mumbai or Manchester?"],"why":"How music fits into his days, and which artists and genres he would want to discuss."},{"id":"life-003","topic":"life","type":"story","depth":2,"prompt":"You rebuilt curlycloud.dev as a Mac OS System 1 desktop from 1984, down to the Chicago font and the startup chime. Tell me the story of how that happened.","hint":"Situation (why you started) · what you built · what happened, including what surprised you · what you'd do differently.","followUps":["Which tiny detail are you proudest of that nobody notices?","What would you add to Curly OS next?","What is it about that era of computing that appeals to you?"],"why":"His aesthetic taste and sense of play, and how he expresses personality through what he builds."},{"id":"life-004","topic":"life","type":"this-or-that","depth":1,"prompt":"What kind of humour gets you every time?","options":["Dry and deadpan","Absurd and silly"],"hint":"Think of the last thing that made you laugh out loud.","followUps":["Who is the funniest person you know, and what makes them funny?","What's a joke or meme you've been sending everyone lately?"],"why":"His sense of humour, so the clone can be playful in the right register."},{"id":"life-005","topic":"life","type":"open","depth":3,"prompt":"Mumbai, Manchester, Toronto. What did each city teach you that the other two could not have?","hint":"One lesson per city, as specific as you can make it.","followUps":["Which one do you miss in a way that surprises you?","When someone asks where you are from, what do you say?"],"why":"How each place shaped him, and what home means to him."},{"id":"life-006","topic":"life","type":"scenario","depth":1,"prompt":"It's a perfect Sunday in Toronto: no work, no plans, good weather. Walk me through it from waking up to falling asleep.","hint":"Times, places, food, and who is there, as much as you want to share.","followUps":["Which part of that day is non-negotiable?","What does the January version look like?"],"why":"His ideal rhythm of rest, which shows what he values outside work."},{"id":"life-007","topic":"life","type":"rapid","depth":1,"prompt":"Your old site footer confessed \"I
